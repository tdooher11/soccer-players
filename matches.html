<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Upcoming Matches — Our Players' Teams</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    .m-wrap{max-width:900px;margin:0 auto;padding:10px 16px 60px}
    .backlink{display:inline-flex;align-items:center;gap:6px;margin-top:10px;background:rgba(255,215,0,.12);
      border:1px solid rgba(255,215,0,.35);border-radius:20px;padding:6px 16px;color:#ffd700;text-decoration:none;
      font-size:.85rem;font-weight:600}
    .backlink:hover{background:rgba(255,215,0,.2);text-decoration:none}

    .status{text-align:center;color:rgba(255,255,255,.7);font-size:.95rem;padding:30px 10px}
    .status .spin{display:inline-block;width:26px;height:26px;border:3px solid rgba(255,255,255,.2);
      border-top-color:#ffd700;border-radius:50%;animation:sp 1s linear infinite;margin-bottom:12px}
    @keyframes sp{to{transform:rotate(360deg)}}

    .day-lab{display:block;margin:26px 4px 12px;font-size:.72rem;font-weight:800;letter-spacing:.12em;
      text-transform:uppercase;color:#ffd700}
    .day-lab:first-child{margin-top:8px}

    .match{display:grid;grid-template-columns:64px 1fr;gap:14px;align-items:center;margin-bottom:12px;
      background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.02));
      border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:14px 16px}
    .match-time{text-align:center}
    .match-time .t{font-size:1.15rem;font-weight:800;color:#6cf;font-variant-numeric:tabular-nums;line-height:1}
    .match-time .ampm{font-size:.62rem;font-weight:700;color:rgba(255,255,255,.5);letter-spacing:.08em}
    .match-time .tbd{font-size:.7rem;color:rgba(255,255,255,.5);font-weight:700}

    .match-body{min-width:0}
    .fixture{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
    .side{display:inline-flex;align-items:center;gap:7px;font-weight:700;font-size:1rem}
    .side.ours{color:#fff}
    .side.opp{color:rgba(255,255,255,.72);font-weight:600}
    .vs{color:rgba(255,255,255,.4);font-weight:800;font-size:.8rem;padding:0 2px}
    .side.ours .badge{box-shadow:0 0 0 2px #ffd700}
    .badge{width:30px;height:30px;flex:none;border-radius:7px;overflow:hidden;background:rgba(255,255,255,.92);
      display:grid;place-items:center}
    .badge img{width:100%;height:100%;object-fit:contain;padding:3px;box-sizing:border-box}
    .badge .bfb{font-weight:800;font-size:.62rem;color:#1a1a2e}

    .comp{margin-top:5px;font-size:.74rem;color:rgba(255,255,255,.5);font-weight:600;
      display:inline-flex;align-items:center;gap:6px}

    .ours-players{display:flex;align-items:center;gap:8px;margin-top:10px;flex-wrap:wrap}
    .ours-players .lead{font-size:.72rem;color:rgba(255,255,255,.55);font-weight:700}
    .pchip{display:inline-flex;align-items:center;gap:5px;background:rgba(108,204,255,.12);
      border:1px solid rgba(108,204,255,.3);border-radius:20px;padding:2px 9px 2px 2px}
    .pchip img{width:24px;height:24px;border-radius:50%;object-fit:cover;object-position:top center;
      background:rgba(255,255,255,.1)}
    .pchip .pn{font-size:.76rem;font-weight:700;color:#dff1ff}

    /* live / finished status */
    .match-time .live{font-size:.72rem;font-weight:800;color:#ff5a5a;letter-spacing:.06em;
      display:inline-flex;align-items:center;gap:4px}
    .match-time .live::before{content:"";width:7px;height:7px;border-radius:50%;background:#ff5a5a;
      animation:pulse 1.2s infinite}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
    .match-time .ft{font-size:.72rem;font-weight:800;color:rgba(255,255,255,.55);letter-spacing:.06em}
    .match-time .score{font-size:1.15rem;font-weight:800;color:#fff;font-variant-numeric:tabular-nums;line-height:1.1}

    /* playing indicators on player chips */
    .pchip.started{border-color:rgba(80,220,120,.6);background:rgba(80,220,120,.16)}
    .pchip.started .pn{color:#c9f7d4}
    .pchip.sub{border-color:rgba(255,190,80,.55);background:rgba(255,190,80,.14)}
    .pchip.sub .pn{color:#ffe6b3}
    .pchip .st{font-size:.72rem;margin-left:2px}

    @media(max-width:520px){
      .match{grid-template-columns:52px 1fr;gap:10px;padding:12px}
      .side{font-size:.92rem}
      .badge{width:26px;height:26px}
    }
  </style>
</head>
<body>
  <header class="hero">
    <h1>Upcoming Matches ⚽📅</h1>
    <p>When do our players' teams play next? Live schedule!</p>
    <a class="backlink" href="index.html">← Back to Player Cards</a>
  </header>

  <main class="m-wrap">
    <div id="content">
      <div class="status"><span class="spin"></span><br>Loading upcoming matches…</div>
    </div>
  </main>

  <script src="players.js"></script>
  <script>
    const API = "https://www.thesportsdb.com/api/v1/json/3";
    // Shorter TTL than before so live status/scores refresh; lineups cached briefly too.
    const NEXT_TTL = 15 * 60 * 1000;   // 15 min
    const LINEUP_TTL = 5 * 60 * 1000;  // 5 min

    function firstName(n){ return n.split(" ")[0]; }

    const sleep = ms => new Promise(r => setTimeout(r, ms));

    // fetch JSON with a couple of retries (the shared free key is globally rate-limited and
    // returns transient 429s/blips — a short backoff usually clears them)
    async function fetchJson(url, tries = 3){
      let lastErr;
      for(let i = 0; i < tries; i++){
        try{
          const res = await fetch(url, { cache:"no-store" });
          if(res.status === 429 || res.status >= 500) throw new Error("http "+res.status);
          if(!res.ok) throw new Error("http "+res.status);
          return await res.json();
        }catch(e){ lastErr = e; if(i < tries-1) await sleep(500 * (i+1) + Math.random()*300); }
      }
      throw lastErr;
    }

    // Cached GET: fresh cache within TTL; on any fetch failure, fall back to stale cache if we have it.
    async function cachedGet(url, cacheKey, ttl){
      let cached = null;
      try{
        const raw = localStorage.getItem(cacheKey);
        if(raw){ const c = JSON.parse(raw); if(c && c.d !== undefined) cached = c; }
      }catch(e){}
      if(cached && Date.now() - cached.t < ttl) return cached.d;
      try{
        const d = await fetchJson(url);
        try{ localStorage.setItem(cacheKey, JSON.stringify({ t:Date.now(), d })); }catch(_){}
        return d;
      }catch(e){
        if(cached) return cached.d;   // serve last-known-good data when the API is flaky
        throw e;
      }
    }

    async function nextEvents(id){
      const j = await cachedGet(`${API}/eventsnext.php?id=${id}`, "sdb_next_" + id, NEXT_TTL);
      return (j && j.events) || [];
    }
    async function lineup(eventId){
      const j = await cachedGet(`${API}/lookuplineup.php?id=${eventId}`, "sdb_lu_" + eventId, LINEUP_TTL);
      return (j && j.lineup) || [];
    }

    // match status → "upcoming" | "live" | "finished"
    const FINISHED = new Set(["FT","AET","PEN","AP","Match Finished","FT_PEN"]);
    function statusOf(ev){
      const s = (ev.strStatus || "").trim();
      if(!s || s === "NS" || s === "Not Started" || s === "TBD") return "upcoming";
      if(FINISHED.has(s)) return "finished";
      return "live"; // 1H, 2H, HT, ET, P, minute counts, etc.
    }

    // normalize a name for fuzzy matching (strip accents/punctuation, lowercase)
    function norm(s){
      return (s || "").normalize("NFD").replace(/[̀-ͯ]/g,"")
        .toLowerCase().replace(/[^a-z0-9 ]/g," ").replace(/\s+/g," ").trim();
    }
    // does a lineup entry refer to our player? (compared within the same club only)
    function samePlayer(ourName, lineupName){
      const a = norm(ourName), b = norm(lineupName);
      if(!a || !b) return false;
      if(a === b) return true;
      return a.includes(b) || b.includes(a);
    }

    // small concurrency pool so we don't hammer the API
    async function pool(items, n, worker){
      const out = []; let i = 0;
      const runners = Array.from({length:Math.min(n, items.length)}, async () => {
        while(i < items.length){ const idx = i++; out[idx] = await worker(items[idx]); }
      });
      await Promise.all(runners);
      return out;
    }

    function badge(url, fallbackText){
      const fb = `<span class="bfb">${fallbackText}</span>`;
      return url
        ? `<span class="badge"><img src="${url}" alt="" loading="lazy" onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'bfb',textContent:'${fallbackText}'}))"></span>`
        : `<span class="badge">${fb}</span>`;
    }
    function abbr(name){ return (name||"?").replace(/[^A-Za-z ]/g,"").split(" ").filter(Boolean).slice(0,2).map(w=>w[0]).join("").toUpperCase() || "?"; }

    function dayGroup(ts){
      const d = new Date(ts);
      const today = new Date(); today.setHours(0,0,0,0);
      const md = new Date(d); md.setHours(0,0,0,0);
      const diff = Math.round((md - today) / 86400000);
      if(diff === 0) return { key:0, label:"Today" };
      if(diff === 1) return { key:1, label:"Tomorrow" };
      return { key:diff, label:d.toLocaleDateString(undefined,{weekday:"long", month:"short", day:"numeric"}) };
    }
    function timeParts(ts, hasTime){
      if(!hasTime) return { t:"", ampm:"", tbd:"TBD" };
      const d = new Date(ts);
      let h = d.getHours(); const m = d.getMinutes();
      const ampm = h >= 12 ? "PM" : "AM"; h = h % 12 || 12;
      return { t:`${h}:${String(m).padStart(2,"0")}`, ampm, tbd:"" };
    }

    (async function boot(){
      let players, ids;
      try{
        [players, ids] = await Promise.all([
          loadPlayers(),
          fetch("team-ids.json", { cache:"no-cache" }).then(r => r.json())
        ]);
      }catch(e){
        document.getElementById("content").innerHTML =
          `<div class="status">😕 Couldn't load the player list. Please refresh.</div>`;
        return;
      }

      // club -> our players on it
      const clubPlayers = {};
      players.forEach(p => {
        if(!p.currentClub || p.currentClub === "Retired") return;
        (clubPlayers[p.currentClub] = clubPlayers[p.currentClub] || []).push(p);
      });
      const clubs = Object.keys(clubPlayers).filter(c => ids[c]);

      // for each club: its current/next event, plus (if live/finished) who of our players played
      let anyOk = false;
      const results = await pool(clubs, 3, async (club) => {
        try{
          const events = await nextEvents(ids[club]);
          anyOk = true;
          const ev = (events || []).filter(e => e.strTimestamp).sort((a,b) => a.strTimestamp.localeCompare(b.strTimestamp))[0];
          if(!ev) return null;
          const status = statusOf(ev);
          let playing = null; // { playerName: "start" | "sub" }
          if(status === "live" || status === "finished"){
            try{
              const lu = await lineup(ev.idEvent);
              const ourSide = lu.filter(e => String(e.idTeam) === String(ids[club]));
              if(ourSide.length){
                playing = {};
                (clubPlayers[club] || []).forEach(p => {
                  const hit = ourSide.find(e => samePlayer(p.name, e.strPlayer));
                  if(hit) playing[p.name] = String(hit.strSubstitute).toLowerCase() === "yes" ? "sub" : "start";
                });
              }
            }catch(_){}
          }
          return { club, ev, status, playing };
        }catch(e){ return null; }
      });

      const matches = results.filter(Boolean);
      if(!matches.length){
        document.getElementById("content").innerHTML = anyOk
          ? `<div class="status">📭 No matches scheduled right now. Check back soon!</div>`
          : `<div class="status">😕 The live schedule is busy right now (it's a free shared service).<br>
               <button onclick="location.reload()" style="margin-top:12px;padding:8px 18px;border-radius:20px;border:1px solid rgba(255,215,0,.4);background:rgba(255,215,0,.14);color:#ffd700;font-weight:700;cursor:pointer">↻ Try again</button></div>`;
        return;
      }

      // live first, then everything by kickoff time
      matches.sort((a,b) => {
        if((a.status === "live") !== (b.status === "live")) return a.status === "live" ? -1 : 1;
        return a.ev.strTimestamp.localeCompare(b.ev.strTimestamp);
      });

      const toISO = t => t.replace(" ", "T") + (t.includes("Z") ? "" : "Z");
      const hasScore = ev => ev.intHomeScore != null && ev.intAwayScore != null;
      function timeCell(m, ts){
        if(m.status === "live"){
          const sc = hasScore(m.ev) ? `<span class="score">${m.ev.intHomeScore}–${m.ev.intAwayScore}</span>` : "";
          return `<span class="live">LIVE</span>${sc}`;
        }
        if(m.status === "finished"){
          const sc = hasScore(m.ev) ? `<span class="score">${m.ev.intHomeScore}–${m.ev.intAwayScore}</span>` : "";
          return `<span class="ft">FT</span>${sc}`;
        }
        const hasTime = !/00:00:00/.test(m.ev.strTimestamp);
        const tp = timeParts(ts, hasTime);
        return tp.tbd ? `<span class="tbd">${tp.tbd}</span>`
                      : `<span class="t">${tp.t}</span><span class="ampm">${tp.ampm}</span>`;
      }

      const anyPlaying = matches.some(m => m.playing);
      let html = anyPlaying
        ? `<div class="status" style="padding:4px 4px 14px;text-align:left;font-size:.78rem;color:rgba(255,255,255,.6)">✅ Started · 🔄 Came on as sub — shown once a match is live or finished.</div>`
        : "";
      let lastLabel = null;

      matches.forEach(m => {
        const { club, ev } = m;
        const ts = toISO(ev.strTimestamp);
        const label = m.status === "live" ? "🔴 Playing Now" : dayGroup(ts).label;
        if(label !== lastLabel){ html += `<span class="day-lab">${label}</span>`; lastLabel = label; }

        const home = ev.strHomeTeam, away = ev.strAwayTeam;
        // "ours" is whichever side matches the team id we queried (exact — handles the two Manchester clubs)
        const homeOurs = String(ev.idHomeTeam) === String(ids[club]);
        const hb = badge(ev.strHomeTeamBadge, abbr(home));
        const ab = badge(ev.strAwayTeamBadge, abbr(away));
        const homeSide = `<span class="side ${homeOurs?'ours':'opp'}">${hb}${home||"TBD"}</span>`;
        const awaySide = `<span class="side ${!homeOurs?'ours':'opp'}">${ab}${away||"TBD"}</span>`;

        const list = clubPlayers[club] || [];
        const ours = list.slice(0, 6).map(p => {
          const st = m.playing ? m.playing[p.name] : null;
          const cls = st === "start" ? " started" : st === "sub" ? " sub" : "";
          const icon = st === "start" ? `<span class="st" title="Started">✅</span>`
                     : st === "sub" ? `<span class="st" title="Came on as substitute">🔄</span>` : "";
          return `<span class="pchip${cls}"><img src="${p.imageUrl}" alt="" loading="lazy" onerror="this.style.visibility='hidden'"><span class="pn">${firstName(p.name)}</span>${icon}</span>`;
        }).join("");
        const more = list.length > 6 ? `<span class="lead">+${list.length-6} more</span>` : "";
        const lead = m.status === "live" ? "Playing now:" : m.status === "finished" ? "Who played:" : "Our players:";

        html += `
          <div class="match">
            <div class="match-time">${timeCell(m, ts)}</div>
            <div class="match-body">
              <div class="fixture">${homeSide}<span class="vs">vs</span>${awaySide}</div>
              <div class="comp">🏆 ${ev.strLeague || ""}</div>
              <div class="ours-players"><span class="lead">${lead}</span>${ours}${more}</div>
            </div>
          </div>`;
      });

      document.getElementById("content").innerHTML = html;
    })();
  </script>
</body>
</html>
