<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>2026 FIFA World Cup</title>
  <style>
    *,*::before,*::after{box-sizing:border-box}
    body{
      margin:0;
      font-family:'Segoe UI',system-ui,sans-serif;
      background:#0b1020;
      color:#fff;
      overflow-x:hidden;
    }

    /* HERO */
    .hero{
      text-align:center;
      padding:32px 20px 18px;
      background:linear-gradient(180deg,rgba(20,26,51,.95),transparent);
      position:relative;
      overflow:hidden;
    }
    .hero::before{
      content:"";
      position:absolute;
      inset:0;
      background:radial-gradient(ellipse at 50% 0%,rgba(255,215,0,.12),transparent 70%);
      pointer-events:none;
    }
    .trophy{font-size:3rem;line-height:1;margin-bottom:8px}
    .hero h1{
      font-size:2.6rem;
      margin:0 0 4px;
      background:linear-gradient(135deg,#ffd700,#ff9500,#ffd700);
      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;
      background-clip:text;
      letter-spacing:-0.5px;
    }
    .hero .subtitle{
      margin:0 0 6px;
      opacity:.65;
      font-size:.95rem;
    }
    .hero .host-badge{
      display:inline-flex;
      align-items:center;
      gap:6px;
      background:rgba(255,215,0,.1);
      border:1px solid rgba(255,215,0,.3);
      border-radius:20px;
      padding:5px 14px;
      font-size:.82rem;
      color:#ffd700;
      font-weight:600;
    }
    .back-link{
      position:absolute;
      top:20px;left:20px;
      color:#6cf;
      text-decoration:none;
      font-size:.85rem;
      opacity:.7;
      transition:opacity .2s;
    }
    .back-link:hover{opacity:1}

    /* STICKY TOOLBAR */
    .toolbar{
      position:sticky;
      top:0;
      z-index:100;
      background:rgba(11,16,32,.95);
      backdrop-filter:blur(14px);
      border-bottom:1px solid rgba(255,255,255,.07);
      padding:12px 20px;
    }
    .toolbar-row{
      display:flex;
      flex-wrap:wrap;
      gap:8px;
      justify-content:center;
      align-items:center;
    }
    .toolbar-row + .toolbar-row{
      margin-top:8px;
    }
    .phase-btns{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
    .chip{
      padding:6px 14px;
      border-radius:20px;
      border:1px solid rgba(255,255,255,.13);
      background:rgba(255,255,255,.06);
      color:#fff;
      font-size:.8rem;
      cursor:pointer;
      transition:all .18s;
      font-family:inherit;
      white-space:nowrap;
    }
    .chip:hover{background:rgba(255,255,255,.13);border-color:rgba(255,255,255,.28)}
    .chip.active{
      background:rgba(255,215,0,.18);
      border-color:#ffd700;
      color:#ffd700;
      font-weight:600;
    }
    .group-chip.active{
      background:rgba(102,204,255,.18);
      border-color:#6cf;
      color:#6cf;
    }
    .divider{width:1px;height:20px;background:rgba(255,255,255,.12);align-self:center}

    /* MAIN CONTENT */
    .content{padding:24px 20px 60px;max-width:1100px;margin:0 auto}

    /* GROUP SECTION */
    .group-section{margin-bottom:40px}
    .group-header{
      display:flex;
      align-items:center;
      gap:12px;
      margin-bottom:16px;
    }
    .group-label{
      font-size:1.1rem;
      font-weight:800;
      color:#ffd700;
      letter-spacing:.5px;
    }
    .group-teams-list{
      font-size:.8rem;
      opacity:.55;
      flex:1;
    }
    .standings-toggle{
      font-size:.75rem;
      color:#6cf;
      cursor:pointer;
      background:none;
      border:none;
      padding:4px 10px;
      border-radius:12px;
      border:1px solid rgba(102,204,255,.3);
      font-family:inherit;
      transition:all .2s;
    }
    .standings-toggle:hover{background:rgba(102,204,255,.1)}

    /* STANDINGS TABLE */
    .standings-wrap{
      display:none;
      margin-bottom:16px;
      overflow:auto;
    }
    .standings-wrap.open{display:block}
    .standings-table{
      width:100%;
      border-collapse:collapse;
      font-size:.82rem;
      background:rgba(255,255,255,.03);
      border-radius:12px;
      overflow:hidden;
    }
    .standings-table th{
      text-align:left;
      padding:8px 12px;
      background:rgba(255,255,255,.06);
      font-size:.7rem;
      text-transform:uppercase;
      letter-spacing:.5px;
      opacity:.6;
      font-weight:600;
    }
    .standings-table td{
      padding:8px 12px;
      border-top:1px solid rgba(255,255,255,.05);
    }
    .standings-table tr.advance td{background:rgba(102,204,255,.06)}
    .standings-table .pos-badge{
      display:inline-flex;
      width:20px;height:20px;
      align-items:center;justify-content:center;
      border-radius:50%;
      font-size:.72rem;
      font-weight:700;
      background:rgba(255,215,0,.15);
      color:#ffd700;
    }
    .standings-table tr.advance .pos-badge{
      background:rgba(102,204,255,.2);
      color:#6cf;
    }
    .standings-table .team-name{display:flex;align-items:center;gap:6px}
    .standings-table .flag{font-size:1rem}
    .standings-table .flag-img{width:22px;height:auto;border-radius:2px;box-shadow:0 1px 3px rgba(0,0,0,.3);vertical-align:middle}
    .num-col{text-align:center;width:36px;font-weight:600}
    .gd-col{text-align:center;width:44px}

    /* MATCHES GRID */
    .matches-grid{
      display:grid;
      grid-template-columns:repeat(auto-fill,minmax(310px,1fr));
      gap:14px;
    }

    /* MATCH CARD */
    .match-card{
      background:linear-gradient(135deg,rgba(255,255,255,.05),rgba(255,255,255,.02));
      border:1px solid rgba(255,255,255,.1);
      border-radius:16px;
      padding:16px;
      transition:transform .18s,box-shadow .18s;
      position:relative;
      overflow:hidden;
    }
    .match-card:hover{
      transform:translateY(-3px);
      box-shadow:0 14px 40px rgba(0,0,0,.5);
    }
    .match-card.status-ft{border-color:rgba(255,255,255,.12)}
    .match-card.status-live{
      border-color:rgba(255,80,80,.5);
      box-shadow:0 0 20px rgba(255,80,80,.1);
      animation:livePulse 2s ease-in-out infinite;
    }
    @keyframes livePulse{
      0%,100%{box-shadow:0 0 20px rgba(255,80,80,.1)}
      50%{box-shadow:0 0 30px rgba(255,80,80,.22)}
    }
    .match-card.status-upcoming{border-color:rgba(255,255,255,.07);opacity:.9}
    .match-card.status-upcoming:hover{opacity:1}

    .match-meta{
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-bottom:12px;
      font-size:.72rem;
    }
    .match-date{opacity:.5}
    .match-venue{opacity:.4;text-align:right;max-width:140px;line-height:1.2}
    .status-badge{
      padding:2px 8px;
      border-radius:10px;
      font-size:.67rem;
      font-weight:700;
      text-transform:uppercase;
      letter-spacing:.5px;
    }
    .badge-ft{background:rgba(255,255,255,.1);color:rgba(255,255,255,.6)}
    .badge-live{background:rgba(255,60,60,.3);color:#ff6060}
    .badge-upcoming{background:rgba(255,255,255,.06);color:rgba(255,255,255,.4)}

    .match-teams{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:8px;
      margin-bottom:12px;
    }
    .team{
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:4px;
      flex:1;
      min-width:0;
    }
    .team .flag{font-size:2rem;line-height:1}
    .team .flag-img{width:44px;height:auto;border-radius:3px;box-shadow:0 1px 4px rgba(0,0,0,.4)}
    .team .name{
      font-size:.8rem;
      font-weight:700;
      text-align:center;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      max-width:100%;
    }

    .scoreboard{
      display:flex;
      align-items:center;
      justify-content:center;
      gap:6px;
      flex-shrink:0;
      min-width:80px;
    }
    .score-num{
      font-size:2rem;
      font-weight:800;
      line-height:1;
      font-variant-numeric:tabular-nums;
    }
    .score-sep{
      font-size:1.2rem;
      opacity:.35;
      font-weight:300;
    }
    .score-upcoming{
      font-size:1.1rem;
      opacity:.4;
      font-weight:600;
      text-align:center;
    }
    .score-time{
      font-size:.85rem;
      opacity:.55;
      font-weight:600;
    }

    /* GOAL SCORERS */
    .scorers{
      border-top:1px solid rgba(255,255,255,.07);
      padding-top:10px;
      display:flex;
      justify-content:space-between;
      gap:8px;
    }
    .scorers-side{flex:1}
    .scorers-side.right{text-align:right}
    .scorer-item{
      font-size:.74rem;
      opacity:.75;
      line-height:1.8;
      display:flex;
      align-items:center;
      gap:3px;
    }
    .scorers-side.right .scorer-item{justify-content:flex-end}
    .scorer-item .min{
      opacity:.5;
      font-size:.68rem;
      font-weight:600;
    }
    .scorer-item .og{
      color:#f88;
      font-size:.65rem;
    }
    .scorer-item .pen{
      color:#fd0;
      font-size:.65rem;
    }
    .ball-icon{font-size:.7rem;opacity:.6}

    /* LIVE MINUTE */
    .live-min{
      display:inline-block;
      background:rgba(255,60,60,.25);
      color:#ff8080;
      border-radius:8px;
      padding:1px 6px;
      font-size:.72rem;
      font-weight:700;
    }

    /* BRACKET VIEW */
    .ko-note{
      background:rgba(102,204,255,.07);
      border:1px solid rgba(102,204,255,.2);
      border-radius:10px;
      padding:10px 14px;
      font-size:.8rem;line-height:1.45;
      color:rgba(255,255,255,.7);
      margin:0 0 14px;
    }
    .ko-note strong{color:#6cf}
    .bracket-scroller{
      overflow-x:auto;
      -webkit-overflow-scrolling:touch;
      padding-bottom:16px;
    }
    .bracket-cols{
      display:flex;
      min-height:720px;
      position:relative;
      gap:0;
      min-width:max-content;
    }
    .bracket-svg{
      position:absolute;top:0;left:0;
      width:100%;height:100%;
      pointer-events:none;overflow:visible;
    }
    .bracket-col{
      display:flex;flex-direction:column;
      width:178px;flex-shrink:0;
      padding:0 6px;
    }
    .bracket-col.col-final{width:198px;flex-shrink:0}
    .bk-final-extras{padding:0 6px 16px;text-align:center}
    .bk-col-head{
      text-align:center;
      padding:4px 0 8px;
      border-bottom:1px solid rgba(255,215,0,.15);
      margin-bottom:6px;
    }
    .bk-col-label{font-size:.68rem;font-weight:800;color:#ffd700;letter-spacing:.8px;text-transform:uppercase}
    .bk-col-date{font-size:.62rem;opacity:.38;margin-top:2px}
    .bk-matches{flex:1;display:flex;flex-direction:column;justify-content:space-around;padding:4px 0}
    .bk-slot{
      background:rgba(255,255,255,.04);
      border:1px solid rgba(255,255,255,.1);
      border-radius:7px;overflow:hidden;
      transition:border-color .18s;
    }
    .bk-slot:hover{border-color:rgba(255,215,0,.4)}
    .bk-team{
      display:flex;align-items:center;
      gap:5px;padding:5px 7px;
      font-size:.73rem;
    }
    .bk-team:first-child{border-bottom:1px solid rgba(255,255,255,.06)}
    .bk-team.win{background:rgba(255,215,0,.09)}
    .bk-team.lose{opacity:.42}
    .bk-team .flag-img{width:18px;height:auto;border-radius:2px;flex-shrink:0}
    .bk-name{flex:1;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .bk-score{font-weight:800;min-width:12px;text-align:right}
    .bk-team.win .bk-name,.bk-team.win .bk-score{color:#ffd700}
    .bk-champion{
      text-align:center;padding:14px 8px 0;
    }
    .bk-trophy{font-size:1.8rem;display:block;margin-bottom:3px}
    .bk-champ-label{font-size:.6rem;letter-spacing:1.5px;opacity:.5;font-weight:700;text-transform:uppercase}
    .bk-champ-name{font-size:1rem;font-weight:800;color:#ffd700;margin-top:4px}
    .bk-3rd-head{
      font-size:.6rem;opacity:.4;text-align:center;
      text-transform:uppercase;letter-spacing:1px;
      margin-top:24px;margin-bottom:4px;
    }

    /* SECTION HEADER (date grouping) */
    .date-label{
      font-size:.72rem;
      text-transform:uppercase;
      letter-spacing:1px;
      opacity:.35;
      margin:20px 0 8px;
      font-weight:600;
    }
    .sched-date-head{
      display:flex;align-items:center;gap:10px;
      margin:28px 0 10px;
      font-size:.8rem;font-weight:800;
      text-transform:uppercase;letter-spacing:1.2px;
      color:rgba(255,255,255,.55);
    }
    .sched-date-head:first-child{margin-top:4px}
    .sched-date-head::after{
      content:'';flex:1;height:1px;
      background:rgba(255,255,255,.08);
    }
    .sched-date-head .live-pip{
      width:7px;height:7px;border-radius:50%;
      background:#f55;animation:livePulse 2s ease-in-out infinite;
      flex-shrink:0;
    }

    /* MOBILE */
    @media(max-width:600px){
      .hero h1{font-size:1.8rem}
      .matches-grid{grid-template-columns:1fr}
      .score-num{font-size:1.6rem}
      .team .flag{font-size:1.5rem}
    }
  </style>
</head>

</div>

    <button class="chip group-chip" data-group="K">K</button>
    <button class="chip group-chip" data-group="L">L</button>
  </div>
</nav>

<main class="content" id="mainContent"></main>

/* =====================================================================
   COMPUTE STANDINGS
   ===================================================================== */
function computeStandings(groupId) {
  const group = GROUPS.find(g => g.id === groupId);
  if (!group) return [];
  const teams = {};
  group.teams.forEach(t => { teams[t] = {name:t,mp:0,w:0,d:0,l:0,gf:0,ga:0,pts:0}; });

  MATCHES.filter(m => m.g === groupId && m.status === "FT").forEach(m => {
    const h = teams[m.home], a = teams[m.away];
    if (!h || !a) return;
    h.mp++; a.mp++;
    h.gf += m.hs; h.ga += m.as;
    a.gf += m.as; a.ga += m.hs;
    if (m.hs > m.as) { h.w++; h.pts+=3; a.l++; }
    else if (m.hs < m.as) { a.w++; a.pts+=3; h.l++; }
    else { h.d++; a.d++; h.pts++; a.pts++; }
  });

  return Object.values(teams).sort((a,b) => {
    if (b.pts !== a.pts) return b.pts - a.pts;
    const gdA = a.gf - a.ga, gdB = b.gf - b.ga;
    if (gdB !== gdA) return gdB - gdA;
    return b.gf - a.gf;
  });
}

/* =====================================================================
   RENDER
   ===================================================================== */
let activePhase = "group";
let activeGroup = "all";

function flag(team) {
  const code = FLAGS[team];
  if (!code) return `<span style="font-size:1.4rem">🏳️</span>`;
  return `<img class="flag-img" src="https://flagcdn.com/w40/${code}.png" alt="${team}" loading="lazy">`;
}

function renderScorers(scorers, team) {
  if (!scorers || !scorers.length) return "";
  return scorers.filter(s => s.t === team).map(s => {
    const ext = s.type === "pen" ? '<span class="pen">(P)</span>' :
                s.type === "og"  ? '<span class="og">OG</span>' : "";
    return `<div class="scorer-item"><span class="ball-icon">⚽</span> ${s.n} <span class="min">${s.min}'</span> ${ext}</div>`;
  }).join("");
}

function renderMatchCard(m) {
  const hFlag = flag(m.home);
  const aFlag = flag(m.away);
  const isLive = m.status === "LIVE";
  const isFT   = m.status === "FT";
  const isNS   = m.status === "NS";

  let badgeHtml = "";
  if (isFT)   badgeHtml = `<span class="status-badge badge-ft">FT</span>`;
  if (isLive) badgeHtml = `<span class="status-badge badge-live">● LIVE <span class="live-min">${m.liveMin}'</span></span>`;
  if (isNS)   badgeHtml = `<span class="status-badge badge-upcoming">${m.time || "TBD"}</span>`;

  let scoreHtml = "";
  if (isFT || isLive) {
    const liveHs = isLive ? (m.scorers ? m.scorers.filter(s=>s.t===m.home).length : 0) : m.hs;
    const liveAs = isLive ? (m.scorers ? m.scorers.filter(s=>s.t===m.away).length : 0) : m.as;
    const hs = isFT ? m.hs : liveHs;
    const as_ = isFT ? m.as : liveAs;
    scoreHtml = `
      <div class="scoreboard">
        <span class="score-num" style="color:${hs > as_ ? '#ffd700' : hs < as_ ? 'rgba(255,255,255,.45)' : '#fff'}">${hs}</span>
        <span class="score-sep">–</span>
        <span class="score-num" style="color:${as_ > hs ? '#ffd700' : as_ < hs ? 'rgba(255,255,255,.45)' : '#fff'}">${as_}</span>
      </div>`;
  } else {
    scoreHtml = `<div class="scoreboard"><div class="score-upcoming">vs</div></div>`;
  }

  const hasScorers = m.scorers && m.scorers.length > 0;
  const scorersHtml = (isFT || isLive) && hasScorers ? `
    <div class="scorers">
      <div class="scorers-side">${renderScorers(m.scorers, m.home)}</div>
      <div class="scorers-side right">${renderScorers(m.scorers, m.away)}</div>
    </div>` : (isFT ? `<div class="scorers"><div style="font-size:.72rem;opacity:.3;padding-top:8px;border-top:1px solid rgba(255,255,255,.07);width:100%">No goals</div></div>` : "");

  return `
    <div class="match-card status-${m.status.toLowerCase()}">
      <div class="match-meta">
        <span class="match-date">${m.date} · MD${m.md}</span>
        ${badgeHtml}
      </div>
      <div class="match-teams">
        <div class="team">
          <span class="flag">${hFlag}</span>
          <span class="name">${m.home}</span>
        </div>
        ${scoreHtml}
        <div class="team">
          <span class="flag">${aFlag}</span>
          <span class="name">${m.away}</span>
        </div>
      </div>
      ${scorersHtml}
    </div>`;
}

function renderStandingsTable(groupId) {
  const standings = computeStandings(groupId);
  if (!standings.length) return "";
  const rows = standings.map((t, i) => {
    const gd = t.gf - t.ga;
    const adv = i < 2;
    return `<tr class="${adv ? 'advance' : ''}">
      <td><span class="pos-badge">${i+1}</span></td>
      <td><div class="team-name"><span class="flag">${flag(t.name)}</span> ${t.name}</div></td>
      <td class="num-col">${t.mp}</td>
      <td class="num-col">${t.w}</td>
      <td class="num-col">${t.d}</td>
      <td class="num-col">${t.l}</td>
      <td class="num-col">${t.gf}</td>
      <td class="num-col">${t.ga}</td>
      <td class="gd-col" style="color:${gd>0?'#6cf':gd<0?'#f88':'inherit'}">${gd>0?'+':''}${gd}</td>
      <td class="num-col" style="color:#ffd700;font-weight:700">${t.pts}</td>
    </tr>`;
  }).join("");

  return `
    <table class="standings-table">
      <thead><tr>
        <th></th><th>Team</th><th>MP</th><th>W</th><th>D</th><th>L</th><th>GF</th><th>GA</th><th>GD</th><th>Pts</th>
      </tr></thead>
      <tbody>${rows}</tbody>
    </table>`;
}

function renderSchedule() {
  const byDate = {};
  [...MATCHES].sort((a,b) => a.id - b.id).forEach(m => {
    (byDate[m.date] = byDate[m.date] || []).push(m);
  });
  const sections = Object.entries(byDate).map(([date, matches]) => {
    const hasLive = matches.some(m => m.status === 'LIVE');
    const pip = hasLive ? '<span class="live-pip"></span>' : '';
    return `<div class="sched-date-head">${pip}${date}</div>
      <div class="matches-grid">${matches.map(renderMatchCard).join('')}</div>`;
  }).join('');
  return `<div>${sections}</div>`;
}

function renderGroupStage() {
  const groups = activeGroup === "all" ? GROUPS : GROUPS.filter(g => g.id === activeGroup);
  return groups.map(g => {
    const matches = MATCHES.filter(m => m.g === g.id);
    const hasPlayed = matches.some(m => m.status === "FT" || m.status === "LIVE");

    return `
      <div class="group-section" data-group="${g.id}">
        <div class="group-header">
          <span class="group-label">GROUP ${g.id}</span>
          <span class="group-teams-list">${g.teams.join(" · ")}</span>
          ${hasPlayed ? `<button class="standings-toggle" onclick="toggleStandings('${g.id}')">Table ▾</button>` : ''}
        </div>
        <div class="standings-wrap" id="standings-${g.id}">
          ${renderStandingsTable(g.id)}
        </div>
        <div class="matches-grid">
          ${matches.map(renderMatchCard).join("")}
        </div>
      </div>`;
  }).join("");
}

    <div class="bk-team ${hWin?'lose':'win'}">${aFlag}<span class="bk-name">${m.away}</span><span class="bk-score">${m.as}</span></div>
  </div>`;
}

function renderBracket() {
  const LABELS = {r32:'Round of 32',r16:'Round of 16',qf:'Quarterfinals',sf:'Semifinals'};
  const DATES  = {r32:'Jun 28–Jul 3',r16:'Jul 4–7',qf:'Jul 9–11',sf:'Jul 14–15'};

  function col(key, side, start, count) {
    const rd = BK.find(b => b.key === key);
    const slots = rd.matches.slice(start, start + count)
      .map((m,i) => bkSlotHTML(m, `bk-${key}-${start+i}`)).join('');
    return `<div class="bracket-col" data-round="${key}" data-side="${side}">
      <div class="bk-col-head">
        <div class="bk-col-label">${LABELS[key]}</div>
        <div class="bk-col-date">${DATES[key]}</div>
      </div>
      <div class="bk-matches">${slots}</div>
    </div>`;
  }

  const finalM = BK.find(b => b.key === 'final').matches[0];
  const center = `<div class="bracket-col col-final">
    <div class="bk-col-head">
      <div class="bk-col-label">Final</div>
      <div class="bk-col-date">Jul 19</div>
    </div>
    <div class="bk-matches">${bkSlotHTML(finalM,'bk-final-0')}</div>
    <div class="bk-final-extras">
      <div class="bk-champion">
        <span class="bk-trophy">🏆</span>
        <div class="bk-champ-label">Projected Champion</div>
        <div class="bk-champ-name">${bkWinner(finalM)}</div>
      </div>
      <div class="bk-3rd-head">3rd Place · Jul 18</div>
      ${bkSlotHTML(THIRD_PLACE,'bk-3rd')}
    </div>
  </div>`;

  return `<div class="bracket-outer">
    <div class="ko-note">🔮 <strong>Projected bracket</strong> — seeded from forecast standings. Argentina vs Portugal in the quarterfinals (Kansas City, Jul 11).</div>
    <div class="bracket-scroller">
      <div class="bracket-cols" id="bracketCols">
        <svg class="bracket-svg" id="bracketSVG" xmlns="http://www.w3.org/2000/svg"></svg>
        ${col('r32','left',0,8)}
        ${col('r16','left',0,4)}
        ${col('qf','left',0,2)}
        ${col('sf','left',0,1)}
        ${center}
        ${col('sf','right',1,1)}
        ${col('qf','right',2,2)}
        ${col('r16','right',4,4)}
        ${col('r32','right',8,8)}
      </div>
    </div>
  </div>`;
}

function drawBracketLines() {
  const svg = document.getElementById('bracketSVG');
  const container = document.getElementById('bracketCols');
  if (!svg || !container) return;
  const cRect = container.getBoundingClientRect();
  const W = container.scrollWidth, H = container.offsetHeight;
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  svg.setAttribute('width', W); svg.setAttribute('height', H);

  const CLR = 'rgba(255,215,0,0.22)';
  let d = '';

  function midY(el) { const r = el.getBoundingClientRect(); return (r.top+r.bottom)/2 - cRect.top; }
  function rx(el)   { return el.getBoundingClientRect().right - cRect.left; }
  function lx(el)   { return el.getBoundingClientRect().left  - cRect.left; }

  // Draw a bracketing pair: two source slots connecting to one target slot
  // goLeft=false: sources are to the LEFT, connector lines go RIGHT
  // goLeft=true:  sources are to the RIGHT, connector lines go LEFT
  function pair(idA, idB, idN, goLeft) {
    const sA = document.getElementById(idA), sB = document.getElementById(idB), sN = document.getElementById(idN);
    if (!sA || !sB || !sN) return;
    const yA = midY(sA), yB = midY(sB), yM = (yA+yB)/2, yN = midY(sN);
    const x1 = goLeft ? lx(sA) : rx(sA);
    const x2 = goLeft ? rx(sN) : lx(sN);
    const xM = (x1+x2)/2;
    d += `M${x1},${yA}L${xM},${yA}L${xM},${yB}L${x1},${yB}M${xM},${yM}L${x2},${yN}`;
  }

  function line(idA, idN, fromRight, toLeft) {
    const sA = document.getElementById(idA), sN = document.getElementById(idN);
    if (!sA || !sN) return;
    d += `M${fromRight?rx(sA):lx(sA)},${midY(sA)}L${toLeft?lx(sN):rx(sN)},${midY(sN)}`;
  }

  // Left half (lines go rightward toward center)
  for (let i=0; i<8; i+=2) pair(`bk-r32-${i}`,`bk-r32-${i+1}`,`bk-r16-${i/2}`,false);
  for (let i=0; i<4; i+=2) pair(`bk-r16-${i}`,`bk-r16-${i+1}`,`bk-qf-${i/2}`,false);
  pair('bk-qf-0','bk-qf-1','bk-sf-0',false);
  line('bk-sf-0','bk-final-0',true,true);   // SF-L right edge → Final left edge

  // Right half (lines go leftward toward center)
  for (let i=8; i<16; i+=2) pair(`bk-r32-${i}`,`bk-r32-${i+1}`,`bk-r16-${(i-8)/2+4}`,true);
  for (let i=4; i<8;  i+=2) pair(`bk-r16-${i}`,`bk-r16-${i+1}`,`bk-qf-${(i-4)/2+2}`,true);
  pair('bk-qf-2','bk-qf-3','bk-sf-1',true);
  line('bk-sf-1','bk-final-0',false,false);  // SF-R left edge → Final right edge

  svg.innerHTML = `<path d="${d}" fill="none" stroke="${CLR}" stroke-width="1.5" stroke-linejoin="round"/>`;
}

function renderKnockout() { return renderBracket(); }

function render() {
  const main = document.getElementById("mainContent");
  const groupFilterRow = document.getElementById("groupFilterRow");
  groupFilterRow.style.display = activePhase === "group" ? "" : "none";

  if (activePhase === "group") {
    main.innerHTML = renderGroupStage();
  } else if (activePhase === "schedule") {
    main.innerHTML = renderSchedule();
  } else {
    main.innerHTML = renderBracket();
    requestAnimationFrame(() => requestAnimationFrame(drawBracketLines));
  }
}

function toggleStandings(groupId) {
  const el = document.getElementById(`standings-${groupId}`);
  el.classList.toggle("open");
  const btn = el.previousElementSibling.querySelector(".standings-toggle");
  if (btn) btn.textContent = el.classList.contains("open") ? "Table ▴" : "Table ▾";
}

/* =====================================================================
   EVENT LISTENERS
   ===================================================================== */
document.querySelectorAll("[data-phase]").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll("[data-phase]").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    activePhase = btn.dataset.phase;
    render();
  });
});

document.querySelectorAll("[data-group]").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll("[data-group]").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    activeGroup = btn.dataset.group;
    render();
  });
});

render();
</script>
